<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SSC Study Shorts</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0f0f0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SSC Shorts">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=23">
</head>
<body>

  <!-- Unified Sleek Header -->
  <header class="app-nav">
    <div class="nav-left">
      <div class="logo" onclick="loadCategory('all')">
        <div class="logo-icon-wrap">
          <!-- Premium Black Cat Face Icon -->
          <svg class="cat-logo-icon" viewBox="0 0 100 100">
            <!-- Cat Head & Alert Ears -->
            <path d="M20 28 L12 2 L40 18 C43.2 17.3 46.5 17 50 17 C53.5 17 56.8 17.3 60 18 L88 2 L80 28 C87 36 91 46 91 57 C91 78 72.6 94 50 94 C27.4 94 9 78 9 57 C9 46 13 36 20 28 Z" fill="#000000"/>
            <!-- Inner Ear Accents -->
            <path d="M23 26 L18 10 L35 21 Z" fill="#ff4444" opacity="0.75"/>
            <path d="M77 26 L82 10 L65 21 Z" fill="#ff4444" opacity="0.75"/>
            <!-- Expressive Almond Eyes -->
            <path d="M27 50 C27 43 38 43 41 50 C38 57 27 57 27 50 Z" fill="#ffffff"/>
            <ellipse cx="34" cy="50" rx="2.5" ry="4.5" fill="#000000"/>
            <circle cx="35" cy="48" r="1.2" fill="#ffffff"/>
            <path d="M73 50 C73 43 62 43 59 50 C62 57 73 57 73 50 Z" fill="#ffffff"/>
            <ellipse cx="66" cy="50" rx="2.5" ry="4.5" fill="#000000"/>
            <circle cx="67" cy="48" r="1.2" fill="#ffffff"/>
            <!-- Cute Nose & Mouth -->
            <polygon points="50,60 46,65 54,65" fill="#ffffff"/>
            <path d="M46 68 Q50 71 50 65 Q50 71 54 68" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <!-- Whiskers -->
            <line x1="12" y1="56" x2="30" y2="60" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
            <line x1="10" y1="64" x2="30" y2="64" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
            <line x1="88" y1="56" x2="70" y2="60" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
            <line x1="90" y1="64" x2="70" y2="64" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
          </svg>
        </div>
        <div class="logo-brand">
          <span class="brand-ssc">SSC</span>
          <span class="brand-divider">/</span>
          <span class="brand-shorts">SHORTS</span>
        </div>
      </div>
    </div>

    <!-- Category Dropdown Picker (Touch to Select Options) -->
    <div class="category-selector-wrap" id="categorySelector">
      <button class="category-dropdown-btn" id="categoryDropdownBtn" title="Choose Category">
        <span id="selectedCategoryLabel">All Topics</span>
        <svg class="dropdown-chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
      </button>

      <div class="category-dropdown-menu" id="categoryDropdownMenu">
        <button class="dropdown-item active" data-category="all">All Topics</button>
        <button class="dropdown-item" data-category="maths">Maths</button>
        <button class="dropdown-item" data-category="reasoning">Reasoning</button>
        <button class="dropdown-item" data-category="english">English</button>
        <button class="dropdown-item" data-category="gk">GK & GS</button>
        <button class="dropdown-item" data-category="animals">Animals</button>
      </div>
    </div>

    <div class="nav-right">
      <!-- Dedicated Saved / Bookmarks Button (Navbar) -->
      <button class="nav-icon-btn" id="navSavedBtn" title="Saved Shorts Library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
      </button>

      <!-- Install App Button -->
      <button class="nav-icon-btn install-btn" id="installAppBtn" title="Install App" style="display: none;">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
      </button>
    </div>

      <!-- Install App Button -->
      <button class="nav-icon-btn install-btn" id="installAppBtn" title="Install App" style="display: none;">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
      </button>
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="shorts-viewport">
    <div class="shorts-feed" id="shortsFeed">
      <!-- Short player cards injected dynamically -->
    </div>

    <!-- Floating Navigation Arrows for Desktop -->
    <div class="floating-nav">
      <button class="nav-arrow-btn" id="prevShortBtn" title="Previous Short">
        <svg style="width:24px;height:24px;fill:#fff;" viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
      </button>
      <button class="nav-arrow-btn" id="nextShortBtn" title="Next Short">
        <svg style="width:24px;height:24px;fill:#fff;" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
      </button>
    </div>
  </main>

  <!-- Toast Notification -->
  <div class="toast-msg" id="toast">Saved to Bookmarks</div>

  <!-- Scripts -->
  <script src="js/shorts-data.js?v=23"></script>
  <script src="data/all_questions.js?v=23"></script>
  <script src="data/mongodb_quizzes.js?v=23"></script>
  <script src="js/quiz-engine.js?v=23"></script>
  <script src="js/app.js?v=23"></script>
  <script src="js/pwa.js?v=23"></script>
</body>
</html>
